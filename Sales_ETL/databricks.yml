# This is a Databricks asset bundle definition for Sales.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Sales
  uuid: 6066036c-c574-45dd-84a4-fe6f8ff4df38

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    #  disabling source linked deployment
    mode: development
    default: true
    presets:
      name_prefix: (dev ${workspace.current_user.short_name})
      source_linked_deployment: false
    workspace:
      host: https://dbc-eb0cf48b-1114.cloud.databricks.com/
    variables:
      catalog: nbn_catalog
      schema: dev_sales
  prod:
    mode: production
    workspace:
      host: https://dbc-eb0cf48b-1114.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/lndpoojan@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lndpoojan@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nbn_catalog
      schema: prod_sales
    permissions:
      - user_name: lndpoojan@gmail.com
        level: CAN_MANAGE
